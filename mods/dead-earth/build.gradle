plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.deadearth'
version = '0.2.0-alpha.1'
base { archivesName = 'dead-earth' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.262'
    runs {
        client {
            client()
            jvmArgument '-Xmx6G'
            if (providers.gradleProperty('deadEarthClientSmoke').isPresent()) systemProperty 'deadearth.clientSmoke', 'true'
            if (providers.gradleProperty('deadEarthSmokeServer').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('deadEarthSmokeServer').get()
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('deadEarthGameTestDirectory').orElse('run-gametest').get())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dead_earth'
        }
    }
    mods { dead_earth { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.dead_earth }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
dependencyLocking { lockAllConfigurations() }
