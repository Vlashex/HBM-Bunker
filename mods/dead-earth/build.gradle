plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.deadearth'
version = '4.4.0'
base { archivesName = 'dead-earth' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
// Reproducible stress-test instrumentation is excluded from ordinary release builds.
if (providers.gradleProperty('deadEarthLoadTest').isPresent()) {
    sourceSets.main.java.srcDir('../../tools/loadtest/java')
}
repositories { mavenCentral() }
neoForge {
    version = '21.1.262'
    runs {
        client {
            client()
            if (providers.gradleProperty('deadEarthLoadTest').isPresent()) {
                systemProperty 'deadearth.loadTestOutput', providers.gradleProperty('deadEarthLoadTestOutput').get()
                programArgument '--width'; programArgument '1600'
                programArgument '--height'; programArgument '900'
            }
            gameDirectory = file(providers.gradleProperty('deadEarthClientDirectory').orElse('run').get())
            if(providers.gradleProperty('deadEarthCinematicScreenshot').isPresent()) systemProperty 'deadearth.cinematicScreenshot','true'
            if(providers.gradleProperty('deadEarthCinematicCloseup').isPresent()) {
                programArgument '--width'; programArgument '1600'
                programArgument '--height'; programArgument '900'
            }
            jvmArgument '-Xmx6G'
            if (providers.gradleProperty('deadEarthClientSmoke').isPresent()) systemProperty 'deadearth.clientSmoke', 'true'
            if (providers.gradleProperty('deadEarthClientNoCapture').isPresent()) systemProperty 'deadearth.clientNoCapture', 'true'
            if (providers.gradleProperty('deadEarthClientShaderSmoke').isPresent()) systemProperty 'deadearth.clientShaderSmoke', 'true'
            if (providers.gradleProperty('deadEarthDefenseClientSmoke').isPresent()) systemProperty 'deadearth.defenseClientSmoke', 'true'
            if (providers.gradleProperty('deadEarthSeasonScreenshot').isPresent()) systemProperty 'deadearth.seasonScreenshot', 'true'
            if (providers.gradleProperty('deadEarthClientSmokeHoldTicks').isPresent()) {
                systemProperty 'deadearth.clientSmokeHoldTicks', providers.gradleProperty('deadEarthClientSmokeHoldTicks').get()
            }
            if (providers.gradleProperty('deadEarthSmokeServer').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('deadEarthSmokeServer').get()
            }
        }
        server {
            server(); programArgument '--nogui'
            if (providers.gradleProperty('deadEarthLoadTest').isPresent()) {
                systemProperty 'deadearth.loadTestOutput', providers.gradleProperty('deadEarthLoadTestOutput').get()
                jvmArgument '-Xmx5G'
                systemProperty 'deadearth.testControls', 'true'
            }
            gameDirectory = file(providers.gradleProperty('deadEarthServerDirectory').orElse('run').get())
            if(providers.gradleProperty('deadEarthCinematicCloseup').isPresent()) systemProperty 'deadearth.cinematicCloseup','true'
            if(providers.gradleProperty('deadEarthCinematicSmoke').isPresent()) {
                systemProperty 'deadearth.cinematicServerSmoke','true'
                systemProperty 'deadearth.testControls','true'
                jvmArgument '-Xmx4G'
            }
            if(providers.gradleProperty('deadEarthDirectorSmoke').isPresent()) {
                systemProperty 'deadearth.directorServerSmoke','true'
                systemProperty 'deadearth.testControls','true'
                jvmArgument '-Xmx4G'
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            jvmArgument '-Xmx4G'
            gameDirectory = file(providers.gradleProperty('deadEarthGameTestDirectory').orElse('run-gametest').get())
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('deadEarthTestNamespaces').orElse('dead_earth,dead_earth_native,dead_earth_review,dead_earth_zones_review,dead_earth_cinematic,dead_earth_loot_review,dead_earth_cinematic_review,dead_earth_worldgen,dead_earth_starter,dead_earth_inventory,dead_earth_food,dead_earth_defense,dead_earth_evolution').get()
        }
    }
    mods { dead_earth { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.dead_earth }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "deadearth.resourceSources", file("src/main/resources").absolutePath
    systemProperty "deadearth.pinnedVanillaResources", file("build/moddev/artifacts/neoforge-21.1.262-client-extra-aka-minecraft-resources.jar").absolutePath
    testLogging { events 'passed', 'failed', 'skipped' }
}
dependencyLocking { lockAllConfigurations() }

// Ship a complete default catalog; server files can override it atomically.
tasks.named('processResources') {
    from('../../pack/config/dead-earth/director') { into 'data/dead_earth/director' }
}
