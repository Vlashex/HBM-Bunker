plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.deadearth'
version = '3.1.0'
base { archivesName = 'dead-earth' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.262'
    runs {
        client {
            client()
            jvmArgument '-Xmx6G'
            if (providers.gradleProperty('deadEarthClientSmoke').isPresent()) systemProperty 'deadearth.clientSmoke', 'true'
            if (providers.gradleProperty('deadEarthSeasonScreenshot').isPresent()) systemProperty 'deadearth.seasonScreenshot', 'true'
            if (providers.gradleProperty('deadEarthClientSmokeHoldTicks').isPresent()) {
                systemProperty 'deadearth.clientSmokeHoldTicks', providers.gradleProperty('deadEarthClientSmokeHoldTicks').get()
            }
            if (providers.gradleProperty('deadEarthSmokeServer').isPresent()) {
                programArgument '--quickPlayMultiplayer'
                programArgument providers.gradleProperty('deadEarthSmokeServer').get()
            }
        }
        server {
            server(); programArgument '--nogui'
            gameDirectory = file(providers.gradleProperty('deadEarthServerDirectory').orElse('run').get())
            if(providers.gradleProperty('deadEarthDirectorSmoke').isPresent()) {
                systemProperty 'deadearth.directorServerSmoke','true'
                systemProperty 'deadearth.testControls','true'
                jvmArgument '-Xmx4G'
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            jvmArgument '-Xmx4G'
            gameDirectory = file(providers.gradleProperty('deadEarthGameTestDirectory').orElse('run-gametest').get())
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('deadEarthTestNamespaces').orElse('dead_earth,dead_earth_native,dead_earth_review,dead_earth_zones_review').get()
        }
    }
    mods { dead_earth { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.dead_earth }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}
dependencyLocking { lockAllConfigurations() }

// Ship a complete default catalog; server files can override it atomically.
tasks.named('processResources') {
    from('../../pack/config/dead-earth/director') { into 'data/dead_earth/director' }
}
