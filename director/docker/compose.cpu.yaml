name: dead-earth-director
services:
  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    container_name: dead-earth-ollama
    restart: "no"
    ports:
      - "127.0.0.1:11434:11434"
    cpus: 4
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_VULKAN: "0"
      CUDA_VISIBLE_DEVICES: "-1"
      OMP_NUM_THREADS: "4"
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  models:
    name: dead-earth-director-models
